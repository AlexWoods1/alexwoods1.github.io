 stroke="#141311" stroke-width="0.8" /><rect x="74" y="102" width="16" height="16" fill="rgba(180, 35, 24, 0.57)" stroke="#141311" stroke-width="0.8" /><rect x="93" y="102" width="16" height="16" fill="rgba(180, 35, 24, 0.43)" stroke="#141311" stroke-width="0.8" /><rect x="112" y="102" width="16" height="16" fill="rgba(180, 35, 24, 0.29)" stroke="#141311" stroke-width="0.8" /><rect x="131" y="102" width="16" height="16" fill="#141311" stroke="#141311" stroke-width="0.8" /><line x1="131" y1="102" x2="147" y2="118" stroke="rgba(243, 240, 232, 0.25)" stroke-width="0.6" /><rect x="36" y="121" width="16" height="16" fill="rgba(180, 35, 24, 0.85)" stroke="#141311" stroke-width="0.8" /><rect x="55" y="121" width="16" height="16" fill="rgba(180, 35, 24, 0.73)" stroke="#141311" stroke-width="0.8" /><rect x="74" y="121" width="16" height="16" fill="rgba(180, 35, 24, 0.62)" stroke="#141311" stroke-width="0.8" /><rect x="93" y="121" width="16" height="16" fill="rgba(180, 35, 24, 0.50)" stroke="#141311" stroke-width="0.8" /><rect x="112" y="121" width="16" height="16" fill="rgba(180, 35, 24, 0.38)" stroke="#141311" stroke-width="0.8" /><rect x="131" y="121" width="16" height="16" fill="rgba(180, 35, 24, 0.27)" stroke="#141311" stroke-width="0.8" />

      <text x="166" y="72" class="font-mono" font-size="7.5" fill="#b42318">■ Active Attention</text>
      <text x="166" y="92" class="font-mono" font-size="7.5" fill="#141311">■ Causal Mask (-∞)</text>
    </g>

    <!-- Formula Detail -->
    <rect x="16" y="198" width="290" height="44" fill="#ffffff" stroke="#141311" stroke-width="0.8" />
    <text x="24" y="215" class="font-mono" font-size="8.5" font-weight="600" fill="#141311">Attn(Q, K, V) = softmax(Q·Kᵀ / √d_k + M)·V</text>
    <text x="24" y="231" class="font-mono" font-size="7.5" fill="rgba(20, 19, 17, 0.7)">PyTorch ~1M-param GPT  ·  Custom training loop</text>
  </g>
</svg>